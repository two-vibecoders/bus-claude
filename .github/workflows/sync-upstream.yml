# Подтягивает skills/bus из jtapes/claude-bus прямо в master.
# Корневой README.md (описание org) не перезаписывается.
#
# Бесплатно для публичного репо:
# - минуты GitHub Actions (public ≈ безлимит на free)
# - встроенный GITHUB_TOKEN
# Токены Cursor / Claude / OpenAI не используются.
# Cron раз в сутки, прогон обычно <1 мин.

name: Sync upstream

on:
  schedule:
    # ~09:00 МСК
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bus-claude
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync skills/bus from jtapes/claude-bus
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git clone --depth 1 --branch main https://github.com/jtapes/claude-bus.git /tmp/upstream
          SHORT="$(git -C /tmp/upstream rev-parse --short HEAD)"
          SHA="$(git -C /tmp/upstream rev-parse HEAD)"

          if [[ ! -d /tmp/upstream/skills/bus ]]; then
            echo 'В upstream нет skills/bus — структура репо изменилась.'
            exit 1
          fi

          mkdir -p skills
          rm -rf skills/bus
          cp -a /tmp/upstream/skills/bus skills/bus
          if [[ -f /tmp/upstream/LICENSE && ! -f LICENSE ]]; then
            cp /tmp/upstream/LICENSE LICENSE
          fi

          git add skills/bus
          [[ -f LICENSE ]] && git add LICENSE || true

          if git diff --staged --quiet; then
            echo "Уже актуально: jtapes/claude-bus@${SHORT}"
            exit 0
          fi

          git commit -m "sync: skills/bus from jtapes/claude-bus@${SHORT}"
          git push origin HEAD:master
          echo "Готово: master ← jtapes/claude-bus@${SHORT} (${SHA})"

# Подтягивает skills/bus из jtapes/claude-bus и открывает PR.
# Корневой README.md (описание org) не перезаписывается.
#
# Бесплатно для публичного репо: минуты Actions + GITHUB_TOKEN.
# Токены Cursor / Claude не используются. Cron раз в сутки, обычно <1 мин.

name: Sync upstream

on:
  schedule:
    # ~09:00 МСК
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bus-claude
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync skills/bus and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git clone --depth 1 --branch main https://github.com/jtapes/claude-bus.git /tmp/upstream
          SHORT="$(git -C /tmp/upstream rev-parse --short HEAD)"
          SHA="$(git -C /tmp/upstream rev-parse HEAD)"

          if [[ ! -d /tmp/upstream/skills/bus ]]; then
            echo 'В upstream нет skills/bus — структура репо изменилась.'
            exit 1
          fi

          mkdir -p skills
          rm -rf skills/bus
          cp -a /tmp/upstream/skills/bus skills/bus
          if [[ -f /tmp/upstream/LICENSE && ! -f LICENSE ]]; then
            cp /tmp/upstream/LICENSE LICENSE
          fi

          git add skills/bus
          [[ -f LICENSE ]] && git add LICENSE || true

          BRANCH=sync/upstream

          if git diff --staged --quiet; then
            # Нечего коммитить: если висит старый PR без новых изменений — ок
            echo "Уже актуально: jtapes/claude-bus@${SHORT}"
            exit 0
          fi

          git checkout -B "$BRANCH"
          git commit -m "sync: skills/bus from jtapes/claude-bus@${SHORT}"
          git push -u origin "$BRANCH" --force

          BODY="$(cat <<EOF
          Автосинхронизация \`skills/bus\` из [jtapes/claude-bus](https://github.com/jtapes/claude-bus).

          - Upstream: [\`${SHORT}\`](https://github.com/jtapes/claude-bus/commit/${SHA})
          - Корневой \`README.md\` **не** перезаписывается (описание org)

          После ревью — Merge. Локальный скилл обновляется из этого репозитория.
          EOF
          )"

          EXISTING="$(gh pr list --head "$BRANCH" --base master --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$EXISTING" ]]; then
            gh pr create --base master --head "$BRANCH" \
              --title "sync: skills/bus from jtapes/claude-bus@${SHORT}" \
              --body "$BODY"
          else
            gh pr edit "$EXISTING" \
              --title "sync: skills/bus from jtapes/claude-bus@${SHORT}" \
              --body "$BODY"
            echo "Обновлён PR #${EXISTING}"
          fi
